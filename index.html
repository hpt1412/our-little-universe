<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Our Little Universe ❤️</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100%;
      height: 100vh;
      overflow: hidden;
      background: #000;
      font-family: Georgia, serif;
    }

    canvas {
      display: block;
    }

    #message {
      position: fixed;
      bottom: max(20px, env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 32px);
      max-width: 720px;
      color: #ffb5d3;
      font-size: clamp(12px, 3.6vw, 14px);
      letter-spacing: clamp(0.5px, 0.4vw, 2px);
      line-height: 1.5;
      text-align: center;
      white-space: normal;
      opacity: 0.8;
      text-shadow: 0 0 12px #ff3b83;
      pointer-events: none;
    }

    #hint {
      position: fixed;
      top: max(24px, env(safe-area-inset-top));
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 32px);
      max-width: 720px;
      color: #f7a4c5;
      font-size: clamp(8px, 2.6vw, 10px);
      letter-spacing: clamp(1.5px, 1vw, 5px);
      line-height: 1.5;
      text-align: center;
      opacity: 0.55;
      white-space: normal;
      pointer-events: none;
    }

    #password-screen {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: grid;
      place-items: center;
      padding: max(24px, env(safe-area-inset-top)) 24px
        max(24px, env(safe-area-inset-bottom));
      background:
        radial-gradient(ellipse at center, #260817 0%, #090308 55%, #000 100%);
    }

    #password-screen[hidden] {
      display: none;
    }

    .password-card {
      width: 100%;
      max-width: 380px;
      padding: clamp(24px, 8vw, 40px);
      border: 1px solid rgba(255, 181, 211, 0.3);
      border-radius: 20px;
      background: rgba(15, 5, 12, 0.88);
      box-shadow: 0 0 45px rgba(255, 23, 79, 0.16);
      color: #ffb5d3;
      text-align: center;
    }

    .password-card h1 {
      margin-bottom: 12px;
      font-size: clamp(21px, 6vw, 27px);
      font-weight: normal;
      text-shadow: 0 0 16px rgba(255, 59, 131, 0.7);
    }

    .password-card p {
      margin-bottom: 24px;
      color: #e6a3bd;
      font-size: 15px;
      line-height: 1.6;
    }

    #password-input {
      width: 100%;
      min-height: 48px;
      margin-bottom: 14px;
      padding: 10px 14px;
      border: 1px solid rgba(255, 181, 211, 0.5);
      border-radius: 10px;
      outline: none;
      background: #100710;
      color: #fff;
      font: inherit;
      font-size: 18px;
      text-align: center;
      letter-spacing: 0.3em;
    }

    #password-input:focus {
      border-color: #ff5b91;
      box-shadow: 0 0 0 3px rgba(255, 91, 145, 0.2);
    }

    #password-submit {
      width: 100%;
      min-height: 48px;
      border: 0;
      border-radius: 10px;
      background: linear-gradient(100deg, #d91e5b, #ff5b91);
      color: #fff;
      font: inherit;
      font-size: 16px;
      cursor: pointer;
    }

    #password-error {
      min-height: 24px;
      margin: 14px 0 0;
      color: #ff8eaa;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <section id="password-screen" aria-labelledby="password-title">
    <div class="password-card">
      <h1 id="password-title">Một món quà nhỏ ❤️</h1>
      <p>Nhập 1 mật khẩu 4 số để mở quà nhé</p>
      <form id="password-form">
        <input
          id="password-input"
          type="password"
          inputmode="numeric"
          maxlength="4"
          autocomplete="off"
          aria-label="Mật khẩu"
          required
        />
        <button id="password-submit" type="submit">Mở quà ngay</button>
        <p id="password-error" role="status" aria-live="polite"></p>
      </form>
    </div>
  </section>

  <script>
    const passwordForm = document.getElementById("password-form");
    const passwordInput = document.getElementById("password-input");
    const passwordError = document.getElementById("password-error");
    const passwordScreen = document.getElementById("password-screen");

    passwordForm.addEventListener("submit", (event) => {
      event.preventDefault();

      if (passwordInput.value === "2102") {
        passwordScreen.hidden = true;
        return;
      }

      passwordError.textContent = "Mật khẩu chưa đúng, thử lại nhé 💕";
      passwordInput.value = "";
      passwordInput.focus();
    });
  </script>

  <div id="hint">HOANGPHUONGTHAO iu LETHEPHUONGHUY</div>
  <div id="message">CHỒNG XÚI GIỎI LẮM, EM TỰ HÀO VỀ ANH</div>

  <script type="module">
    import * as THREE from
      "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js";

    // ==========================================
    // 1. KHỞI TẠO KHÔNG GIAN 3D
    // ==========================================

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x000000);

    const camera = new THREE.PerspectiveCamera(
      45,
      window.innerWidth / window.innerHeight,
      0.1,
      1000
    );

    camera.position.set(0, 0, 17);

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      alpha: false
    });

    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(
      Math.min(window.devicePixelRatio, 2)
    );

    document.body.appendChild(renderer.domElement);

    // Nhóm trái tim để có thể xoay toàn bộ
    const heartGroup = new THREE.Group();
    scene.add(heartGroup);

    // ==========================================
    // 2. TẠO HẠT SÁNG
    // ==========================================

    const heartCount = 18000;
    const heartPositions = new Float32Array(heartCount * 3);
    const heartColors = new Float32Array(heartCount * 3);
    const heartSizes = new Float32Array(heartCount);

    const pink = new THREE.Color(0xff174f);
    const hotPink = new THREE.Color(0xff5b91);
    const palePink = new THREE.Color(0xffb5d3);

    // Phương trình tạo hình trái tim.
    // Hạt được lấy ngẫu nhiên bên trong đường viền.
    function insideHeart(x, y) {
      const a = x * x + y * y - 1;

      return a * a * a - x * x * y * y * y <= 0;
    }

    for (let i = 0; i < heartCount; i++) {
      let x, y;

      do {
        x = (Math.random() * 2 - 1) * 1.35;
        y = (Math.random() * 2 - 1) * 1.35;
      } while (!insideHeart(x, y));

      // Giữ trục Y để đầu nhọn hướng xuống dưới trên màn hình
      const px = x * 3.2;
      const py = y * 3.2;

      // Độ sâu 3D: phần giữa dày, phần rìa mỏng hơn
      const normalizedRadius = Math.min(
        1,
        Math.sqrt(x * x + y * y)
      );

      const depth =
        (Math.random() - 0.5) *
        1.3 *
        (0.3 + 0.7 * (1 - normalizedRadius));

      const index = i * 3;

      heartPositions[index] = px;
      heartPositions[index + 1] = py;
      heartPositions[index + 2] = depth;

      // Phối nhiều sắc độ hồng
      const colorChoice = Math.random();
      let color;

      if (colorChoice < 0.65) {
        color = pink;
      } else if (colorChoice < 0.92) {
        color = hotPink;
      } else {
        color = palePink;
      }

      const brightness = 0.55 + Math.random() * 0.75;

      heartColors[index] = color.r * brightness;
      heartColors[index + 1] = color.g * brightness;
      heartColors[index + 2] = color.b * brightness;

      heartSizes[i] = 0.5 + Math.random() * 1.5;
    }

    const heartGeometry = new THREE.BufferGeometry();

    heartGeometry.setAttribute(
      "position",
      new THREE.BufferAttribute(heartPositions, 3)
    );

    heartGeometry.setAttribute(
      "particleColor",
      new THREE.BufferAttribute(heartColors, 3)
    );

    heartGeometry.setAttribute(
      "size",
      new THREE.BufferAttribute(heartSizes, 1)
    );

    // Shader tạo những hạt tròn phát sáng
    const heartMaterial = new THREE.ShaderMaterial({
      uniforms: {
        uTime: { value: 0 }
      },

      vertexShader: `
        attribute float size;
        attribute vec3 particleColor;

        varying vec3 vColor;
        varying float vAlpha;

        uniform float uTime;

        void main() {
          vColor = particleColor;

          vec3 p = position;

          // Chuyển động rung rất nhẹ
          p.x += sin(uTime * 1.2 + position.y * 3.0)
                 * 0.018;

          p.y += cos(uTime * 1.0 + position.x * 2.0)
                 * 0.018;

          vec4 mvPosition =
            modelViewMatrix * vec4(p, 1.0);

          gl_Position = projectionMatrix * mvPosition;

          gl_PointSize =
            size * (100.0 / -mvPosition.z);

          vAlpha = 0.65 + 0.35 *
            sin(uTime * 2.0 + position.x * 4.0);
        }
      `,

      fragmentShader: `
        varying vec3 vColor;
        varying float vAlpha;

        void main() {
          vec2 uv = gl_PointCoord - vec2(0.5);

          float distanceToCenter = length(uv);

          if (distanceToCenter > 0.5) discard;

          float glow = exp(-distanceToCenter * 9.0);

          float core = smoothstep(
            0.20, 0.02, distanceToCenter
          );

          float alpha = glow * 0.75 + core * 0.65;

          gl_FragColor = vec4(
            vColor * (1.0 + core),
            alpha * vAlpha
          );
        }
      `,

      transparent: true,
      depthWrite: false,
      blending: THREE.AdditiveBlending,
      vertexColors: false
    });

    const heartPoints = new THREE.Points(
      heartGeometry,
      heartMaterial
    );

    heartGroup.add(heartPoints);

    // ==========================================
    // 3. TẠO VÒNG TRÒN HẠT BÊN DƯỚI
    // ==========================================

    const ringGroup = new THREE.Group();
    scene.add(ringGroup);

    const ringCount = 6500;
    const ringPositions = new Float32Array(ringCount * 3);
    const ringColors = new Float32Array(ringCount * 3);

    for (let i = 0; i < ringCount; i++) {
      const index = i * 3;

      // Nhiều vòng elip với bán kính khác nhau
      const angle = Math.random() * Math.PI * 2;

      const radius =
        2.0 + Math.random() * 2.2;

      const x = Math.cos(angle) * radius;
      const z = Math.sin(angle) * radius * 0.55;

      // Vòng tròn nằm bên dưới trái tim
      const y =
        -2.6 +
        (Math.random() - 0.5) * 0.75 +
        Math.sin(angle * 3) * 0.12;

      ringPositions[index] = x;
      ringPositions[index + 1] = y;
      ringPositions[index + 2] = z;

      const brightness = Math.random();

      ringColors[index] = 0.65 + brightness * 0.35;
      ringColors[index + 1] = 0.12 + brightness * 0.2;
      ringColors[index + 2] = 0.30 + brightness * 0.4;
    }

    const ringGeometry = new THREE.BufferGeometry();

    ringGeometry.setAttribute(
      "position",
      new THREE.BufferAttribute(ringPositions, 3)
    );

    ringGeometry.setAttribute(
      "color",
      new THREE.BufferAttribute(ringColors, 3)
    );

    const ringMaterial = new THREE.PointsMaterial({
      size: 0.035,
      vertexColors: true,
      transparent: true,
      opacity: 0.8,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
      sizeAttenuation: true
    });

    const ringPoints = new THREE.Points(
      ringGeometry,
      ringMaterial
    );

    ringGroup.add(ringPoints);

    // ==========================================
    // 4. BẦU TRỜI SAO
    // ==========================================

    const starCount = 2200;
    const starPositions = new Float32Array(starCount * 3);

    for (let i = 0; i < starCount; i++) {
      const index = i * 3;

      starPositions[index] =
        (Math.random() - 0.5) * 35;

      starPositions[index + 1] =
        (Math.random() - 0.5) * 25;

      starPositions[index + 2] =
        -5 - Math.random() * 25;
    }

    const starGeometry = new THREE.BufferGeometry();

    starGeometry.setAttribute(
      "position",
      new THREE.BufferAttribute(starPositions, 3)
    );

    const starMaterial = new THREE.PointsMaterial({
      color: 0xffffff,
      size: 0.025,
      transparent: true,
      opacity: 0.7,
      sizeAttenuation: true
    });

    const stars = new THREE.Points(
      starGeometry,
      starMaterial
    );

    scene.add(stars);

    // ==========================================
    // 5. HIỆU ỨNG CHUYỂN ĐỘNG
    // ==========================================

    const clock = new THREE.Clock();

    let targetRotationX = 0;
    let targetRotationY = 0;

    // Cho phép rê chuột để quan sát trái tim
    window.addEventListener("pointermove", (event) => {
      targetRotationY =
        ((event.clientX / window.innerWidth) - 0.5) * 0.5;

      targetRotationX =
        ((event.clientY / window.innerHeight) - 0.5) * 0.25;
    });

    function animate() {
      requestAnimationFrame(animate);

      const time = clock.getElapsedTime();

      heartMaterial.uniforms.uTime.value = time;

      // Trái tim đập nhẹ
      const heartbeat =
        1 + Math.pow(
          Math.max(0, Math.sin(time * 2.0)),
          18
        ) * 0.035;

      heartGroup.scale.setScalar(heartbeat);

      // Xoay nhẹ trong không gian 3D
      heartGroup.rotation.y +=
        (targetRotationY - heartGroup.rotation.y) * 0.025;

      heartGroup.rotation.x +=
        (targetRotationX - heartGroup.rotation.x) * 0.025;

      heartGroup.rotation.y +=
        Math.sin(time * 0.25) * 0.0008;

      // Các vòng hạt xoay chậm
      ringGroup.rotation.y = time * 0.07;
      ringGroup.rotation.z = Math.sin(time * 0.3) * 0.035;

      // Ngôi sao chuyển động nhẹ
      stars.rotation.y = time * 0.008;

      renderer.render(scene, camera);
    }

    animate();

    // ==========================================
    // 6. TƯƠNG THÍCH ĐIỆN THOẠI
    // ==========================================

    window.addEventListener("resize", () => {
      camera.aspect =
        window.innerWidth / window.innerHeight;

      camera.position.z =
        window.innerWidth < 600 ? 19 : 17;

      camera.updateProjectionMatrix();

      renderer.setSize(
        window.innerWidth,
        window.innerHeight
      );
    });

    if (window.innerWidth < 600) {
      camera.position.z = 19;
      camera.updateProjectionMatrix();
    }
  </script>
</body>
</html>
